<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hireflow - Job Openings</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #172b4d;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 240px;
            background: #172b4d;
            color: white;
            padding: 25px 15px;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 35px;
        }

        .logo span {
            color: #2f6df6;
        }

        .menu a {
            display: block;
            text-decoration: none;
            color: #dbe4f2;
            padding: 13px 15px;
            margin-bottom: 7px;
            border-radius: 8px;
            font-size: 15px;
            transition: 0.2s;
        }

        .menu a:hover,
        .menu a.active {
            background: #2f6df6;
            color: white;
        }

        /* MAIN */

        .main {
            margin-left: 240px;
            width: calc(100% - 240px);
            padding: 30px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .topbar h1 {
            font-size: 30px;
            margin-bottom: 7px;
        }

        .topbar p {
            color: #718096;
            font-size: 15px;
        }

        .admin {
            background: white;
            padding: 12px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
            font-weight: bold;
        }

        /* FORM CARD */

        .form-card {
            background: white;
            padding: 25px;
            border-radius: 13px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 21px;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: span 2;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
            color: #374151;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #d7dee9;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
            background: white;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #2f6df6;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .button-row {
            margin-top: 20px;
        }

        .primary-button {
            border: none;
            background: #2f6df6;
            color: white;
            padding: 12px 24px;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .primary-button:hover {
            background: #1f56d1;
        }

        /* TABLE CARD */

        .table-card {
            background: white;
            padding: 25px;
            border-radius: 13px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th {
            text-align: left;
            color: #718096;
            font-size: 13px;
            padding: 13px 10px;
            border-bottom: 1px solid #e5e7eb;
        }

        td {
            padding: 15px 10px;
            border-bottom: 1px solid #edf0f5;
            font-size: 14px;
        }

        .status {
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .open {
            background: #dcfce7;
            color: #15803d;
        }

        .closed {
            background: #fee2e2;
            color: #b91c1c;
        }

        .draft {
            background: #fef3c7;
            color: #92400e;
        }

        .delete-button {
            border: none;
            background: #fee2e2;
            color: #b91c1c;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .delete-button:hover {
            background: #fecaca;
        }

        .empty {
            text-align: center;
            color: #718096;
            padding: 35px;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #b91c1c;
        }

        /* RESPONSIVE */

        @media (max-width: 900px) {

            .sidebar {
                width: 200px;
            }

            .main {
                margin-left: 200px;
                width: calc(100% - 200px);
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: span 1;
            }
        }

        @media (max-width: 650px) {

            .sidebar {
                width: 70px;
                padding: 20px 8px;
            }

            .logo {
                font-size: 18px;
            }

            .menu a {
                font-size: 11px;
                padding: 12px 5px;
                text-align: center;
            }

            .main {
                margin-left: 70px;
                width: calc(100% - 70px);
                padding: 20px;
            }

            .topbar {
                align-items: flex-start;
                gap: 15px;
            }

            .topbar h1 {
                font-size: 25px;
            }

            .admin {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            Hire<span>flow</span>
        </div>

        <div class="menu">

            <a href="/dashboard">
                Dashboard
            </a>

            <a href="/jobs" class="active">
                Job Openings
            </a>

            <a href="/applicants">
                Applicants
            </a>

            <a href="/panel-members">
                Interview Panel
            </a>

            <a href="/interviews">
                Interviews
            </a>

            <a href="/feedback">
                Feedback
            </a>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <div class="topbar">

            <div>

                <h1>
                    Job Openings
                </h1>

                <p>
                    Create and manage available positions
                </p>

            </div>

            <div class="admin">
                Admin
            </div>

        </div>


        <!-- CREATE JOB -->

        <div class="form-card">

            <h2 class="section-title">
                Create Job Opening
            </h2>

            <form id="jobForm">

                <div class="form-grid">

                    <div class="form-group">

                        <label for="title">
                            Job Title
                        </label>

                        <input
                                type="text"
                                id="title"
                                placeholder="Enter job title"
                                required
                        >

                    </div>


                    <div class="form-group">

                        <label for="department">
                            Department
                        </label>

                        <input
                                type="text"
                                id="department"
                                placeholder="Enter department"
                                required
                        >

                    </div>


                    <div class="form-group">

                        <label for="location">
                            Location
                        </label>

                        <input
                                type="text"
                                id="location"
                                placeholder="Enter location"
                                required
                        >

                    </div>


                    <div class="form-group">

                        <label for="status">
                            Status
                        </label>

                        <select id="status">

                            <option value="OPEN">
                                OPEN
                            </option>

                            <option value="CLOSED">
                                CLOSED
                            </option>

                            <option value="DRAFT">
                                DRAFT
                            </option>

                        </select>

                    </div>


                    <div class="form-group full">

                        <label for="description">
                            Job Description
                        </label>

                        <textarea
                                id="description"
                                placeholder="Enter job description"
                                required
                        ></textarea>

                    </div>

                </div>


                <div class="button-row">

                    <button
                            type="submit"
                            class="primary-button"
                    >
                        Create Job
                    </button>

                </div>


                <div id="message"
                     class="message">
                </div>

            </form>

        </div>


        <!-- JOB LIST -->

        <div class="table-card">

            <h2 class="section-title">
                Available Job Openings
            </h2>

            <table>

                <thead>

                <tr>

                    <th>
                        ID
                    </th>

                    <th>
                        Job Title
                    </th>

                    <th>
                        Department
                    </th>

                    <th>
                        Location
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Created
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

                </thead>

                <tbody id="jobTable">

                <tr>

                    <td colspan="7"
                        class="empty">
                        Loading job openings...
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </main>

</div>


<script>

    const jobForm =
        document.getElementById("jobForm");

    const jobTable =
        document.getElementById("jobTable");

    const message =
        document.getElementById("message");


    /* LOAD JOBS */

    async function loadJobs() {

        try {

            const response =
                await fetch("/api/jobs");

            if (!response.ok) {
                throw new Error(
                    "Failed to load jobs"
                );
            }

            const jobs =
                await response.json();

            jobTable.innerHTML = "";


            if (jobs.length === 0) {

                jobTable.innerHTML = `
                    <tr>
                        <td colspan="7"
                            class="empty">
                            No job openings found.
                        </td>
                    </tr>
                `;

                return;
            }


            jobs.forEach(job => {

                let statusClass = "";

                if (job.status === "OPEN") {
                    statusClass = "open";
                }
                else if (job.status === "CLOSED") {
                    statusClass = "closed";
                }
                else if (job.status === "DRAFT") {
                    statusClass = "draft";
                }


                const createdDate =
                    job.createdAt
                        ? new Date(
                            job.createdAt
                        ).toLocaleDateString()
                        : "N/A";


                jobTable.innerHTML += `

                    <tr>

                        <td>
                            ${job.id}
                        </td>

                        <td>
                            <strong>
                                ${job.title || "N/A"}
                            </strong>
                        </td>

                        <td>
                            ${job.department || "N/A"}
                        </td>

                        <td>
                            ${job.location || "N/A"}
                        </td>

                        <td>

                            <span
                                class="status ${statusClass}"
                            >
                                ${job.status || "N/A"}
                            </span>

                        </td>

                        <td>
                            ${createdDate}
                        </td>

                        <td>

                            <button
                                class="delete-button"
                                onclick="deleteJob(${job.id})"
                            >
                                Delete
                            </button>

                        </td>

                    </tr>

                `;

            });

        }
        catch (error) {

            console.error(error);

            jobTable.innerHTML = `
                <tr>
                    <td colspan="7"
                        class="empty">
                        Unable to load job openings.
                    </td>
                </tr>
            `;

        }

    }


    /* CREATE JOB */

    jobForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            message.textContent = "";
            message.className = "message";


            const jobData = {

                title:
                    document.getElementById(
                        "title"
                    ).value.trim(),

                description:
                    document.getElementById(
                        "description"
                    ).value.trim(),

                department:
                    document.getElementById(
                        "department"
                    ).value.trim(),

                location:
                    document.getElementById(
                        "location"
                    ).value.trim(),

                status:
                document.getElementById(
                    "status"
                ).value

            };


            try {

                const response =
                    await fetch(
                        "/api/jobs",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    jobData
                                )
                        }
                    );


                if (!response.ok) {

                    const errorText =
                        await response.text();

                    throw new Error(
                        errorText ||
                        "Failed to create job"
                    );

                }


                message.textContent =
                    "Job opening created successfully.";

                message.className =
                    "message success";


                jobForm.reset();

                document.getElementById(
                    "status"
                ).value = "OPEN";


                await loadJobs();

            }
            catch (error) {

                console.error(error);

                message.textContent =
                    "Unable to create job opening.";

                message.className =
                    "message error";

            }

        }
    );


    /* DELETE JOB */

    async function deleteJob(id) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this job opening?"
            );


        if (!confirmed) {
            return;
        }


        try {

            const response =
                await fetch(
                    `/api/jobs/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to delete job"
                );

            }


            await loadJobs();

        }
        catch (error) {

            console.error(error);

            alert(
                "Unable to delete job opening."
            );

        }

    }


    /* INITIAL LOAD */

    loadJobs();

</script>

</body>
</html>

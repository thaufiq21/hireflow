# ==========================================
# HIRE-FLOW APPLICATION
# ==========================================

spring.application.name=hireflow

# ==========================================
# SERVER
# ==========================================

server.port=8080

# ==========================================
# MYSQL DATABASE
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/hireflow?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true

spring.datasource.username=root

spring.datasource.password=adithyan

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# THYMELEAF
# ==========================================

spring.thymeleaf.cache=false